{% extends "base.html" %}

{% block content %}
<div class="bg-muted/50 flex min-h-dvh items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="card">
      <header class="p-5">
        <h2 class="text-3xl font-bold">Check Your Email</h2>
        <p class="text-muted-foreground mt-2 text-sm">Password reset instructions are on their way.</p>
      </header>
      <section class="p-5">
        <p>We have sent you an email. If you have not received it, please check your spam folder. Otherwise contact us if you do not receive it within a few minutes.</p>
        <a href="{% url 'account_login' %}" class="btn mt-6 w-full">Back to Login</a>
      </section>
    </div>
  </div>
</div>
{% endblock %}
