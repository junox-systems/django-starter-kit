{% extends "base_app.html" %}

{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="w-full max-w-2xl space-y-6">
  <c-card title="Change Password" description="Keep your account secure." lead>
    <c-form action="{% url 'account_change_password' %}">
      {{ redirect_field }}
      <c-fields :form="form" />
      <c-btn class="w-full" type="submit">Change Password</c-btn>
    </c-form>
    <a href="{% url 'account_reset_password' %}" class="text-muted-foreground hover:text-foreground mt-4 block text-center text-sm underline-offset-4 hover:underline">Forgot Password?</a>
  </c-card>
</div>
{% endblock %}
