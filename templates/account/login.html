{% extends "base.html" %}

{% block content %}
<c-center>
  <c-card title="Login now!" description="Welcome back — sign in to your account." lead>
    <c-form>
      {{ redirect_field }}
      <c-fields :form="form" />
      <c-btn class="w-full">Login</c-btn>
    </c-form>
  </c-card>
  <p class="text-muted-foreground mt-4 text-center text-sm">
    Don't have an account? <a href="{% url 'account_signup' %}" class="text-foreground underline-offset-4 hover:underline">Sign up</a>
  </p>
</c-center>
{% endblock %}
