{% extends "base.html" %}

{% block content %}
<div class="bg-muted/50 flex min-h-dvh items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="card">
      <header class="p-5">
        <h2 class="text-3xl font-bold">Sign Up now!</h2>
        <p class="text-muted-foreground mt-2 text-sm">Join us and start building amazing things!</p>
      </header>
      <section class="p-5">
        <form method="post" class="space-y-4">
          {% csrf_token %}
          {% include "account/_form_fields.html" %}
          <p class="text-muted-foreground text-xs">
            By signing up you agree to the <a href="{% url 'terms' %}" class="text-foreground underline-offset-4 hover:underline">Terms</a>
            and <a href="{% url 'privacy' %}" class="text-foreground underline-offset-4 hover:underline">Privacy Policy</a>.
          </p>
          <button class="btn w-full">Sign Up</button>
        </form>
      </section>
    </div>
    <p class="text-muted-foreground mt-4 text-center text-sm">
      Already have an account? <a href="{% url 'account_login' %}" class="text-foreground underline-offset-4 hover:underline">Login</a>
    </p>
  </div>
</div>
{% endblock %}
