{% extends "base.html" %}

{% block content %}
<c-center>
  <c-card title="Sign Up now!" description="Join us and start building amazing things!" lead>
    <c-form>
      <c-fields :form="form" />
      <p class="text-muted-foreground text-xs">
        By signing up you agree to the <a href="{% url 'terms' %}" class="text-foreground underline-offset-4 hover:underline">Terms</a>
        and <a href="{% url 'privacy' %}" class="text-foreground underline-offset-4 hover:underline">Privacy Policy</a>.
      </p>
      <c-btn class="w-full">Sign Up</c-btn>
    </c-form>
  </c-card>
  <p class="text-muted-foreground mt-4 text-center text-sm">
    Already have an account? <a href="{% url 'account_login' %}" class="text-foreground underline-offset-4 hover:underline">Login</a>
  </p>
</c-center>
{% endblock %}
