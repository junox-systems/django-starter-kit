{% extends "base_app.html" %}

{% block page_title %}Re-authenticate{% endblock %}

{% block content %}
<div class="w-full max-w-2xl space-y-6">
  <c-card title="Re-authenticate" description="Enter your password to continue." lead>
    <c-form action="{% url 'account_reauthenticate' %}">
      {{ redirect_field }}
      <c-fields :form="form" />
      <c-btn class="w-full" type="submit">Confirm</c-btn>
    </c-form>
  </c-card>
</div>
{% endblock %}
