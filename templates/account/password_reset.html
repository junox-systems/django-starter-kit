{% extends "base.html" %}

{% block content %}
<c-center>
  <c-card title="Reset Password" description="Enter your email address to reset your password." lead>
    <c-form>
      <c-fields :form="form" />
      <c-btn class="w-full">Reset Password</c-btn>
    </c-form>
  </c-card>
  <p class="text-muted-foreground mt-4 text-center text-sm">

  </p>
</c-center>
{% endblock %}
