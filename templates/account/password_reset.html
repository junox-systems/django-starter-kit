{% extends "base.html" %}

{% block content %}
<div class="bg-muted/50 flex min-h-dvh items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="card">
      <header class="p-5">
        <h2 class="text-3xl font-bold">Reset Password</h2>
        <p class="text-muted-foreground mt-2 text-sm">Enter your email address to reset your password.</p>
      </header>
      <section class="p-5">
        <form method="post" class="space-y-4">
          {% csrf_token %}
          {% include "account/_form_fields.html" %}
          <button class="btn w-full">Reset Password</button>
        </form>
      </section>
    </div>
    <p class="text-muted-foreground mt-4 text-center text-sm">
      <a href="{% url 'account_login' %}" class="underline-offset-4 hover:underline">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
