{% extends "base_app.html" %}

{% block page_title %}Set Password{% endblock %}

{% block content %}
<div class="w-full max-w-2xl space-y-6">
  <c-card title="Set Password" description="Add a password to your account." lead>
    <c-form action="{% url 'account_set_password' %}">
      {{ redirect_field }}
      <c-fields :form="form" />
      <c-btn class="w-full" type="submit" name="action">Set Password</c-btn>
    </c-form>
  </c-card>
</div>
{% endblock %}
