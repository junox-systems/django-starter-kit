{% if messages %}
    <div class="mx-auto w-full max-w-5xl space-y-2 px-4 pt-4">
        {% for message in messages %}
            <div class="alert"{% if message.tags == 'error' or message.tags == 'debug' %} data-variant="destructive"{% endif %} role="{% if message.tags == 'error' or message.tags == 'debug' %}alert{% else %}status{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}
