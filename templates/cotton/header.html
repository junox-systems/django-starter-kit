<header class="border-border bg-background relative border-b" data-controller="navbar">
    <nav class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4">
        <div class="flex items-center gap-6">
            <a class="font-heading text-xl font-semibold tracking-tight" href="{% url 'home' %}">Django Starter Kit</a>
            <ul class="hidden items-center gap-1 text-sm md:flex">
                <li><a class="text-muted-foreground hover:text-foreground rounded-md px-3 py-2 transition-colors" href="{% url 'admin:index' %}">Admin</a></li>
                {% if user.is_authenticated %}
                    <li><a class="text-muted-foreground hover:text-foreground rounded-md px-3 py-2 transition-colors" href="{% url 'dashboard' %}">Dashboard</a></li>
                    <li>
                        <c-form action="{% url 'account_logout' %}"><button type="submit" class="text-muted-foreground hover:text-foreground cursor-pointer rounded-md px-3 py-2 transition-colors">Logout</button></c-form>
                    </li>
                {% else %}
                    <li><a class="text-muted-foreground hover:text-foreground rounded-md px-3 py-2 transition-colors" href="{% url 'account_login' %}">Login</a></li>
                {% endif %}
            </ul>
        </div>
        <div class="flex items-center gap-2">
            <c-theme-toggle />
            {% if not user.is_authenticated %}
                <c-btn href="{% url 'account_signup' %}" class="hidden md:inline-flex">Sign up</c-btn>
            {% endif %}
            <c-btn variant="ghost" size="icon" class="size-9 md:hidden" type="button" data-navbar-target="hamburgerIcon" data-action="click->navbar#toggleMenu" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu"><c-icon.menu /></c-btn>
            <c-btn variant="ghost" size="icon" class="size-9 md:hidden" type="button" data-navbar-target="closeIcon" data-action="click->navbar#closeMenu" aria-label="Close menu" hidden><c-icon.x /></c-btn>
        </div>
    </nav>
    <div class="border-border bg-background absolute inset-x-0 top-full border-b shadow-lg md:hidden" id="mobile-menu" data-navbar-target="mobileMenu" hidden>
        <ul class="mx-auto max-w-5xl space-y-1 px-4 py-4 text-sm">
            <li><a class="hover:bg-muted block rounded-md px-3 py-2" href="{% url 'admin:index' %}" data-action="click->navbar#closeMenu">Admin</a></li>
            {% if user.is_authenticated %}
                <li><a class="hover:bg-muted block rounded-md px-3 py-2" href="{% url 'dashboard' %}" data-action="click->navbar#closeMenu">Dashboard</a></li>
                <li>
                    <c-form action="{% url 'account_logout' %}"><button type="submit" class="hover:bg-muted w-full cursor-pointer rounded-md px-3 py-2 text-left" data-action="click->navbar#closeMenu">Logout</button></c-form>
                </li>
            {% else %}
                <li><a class="hover:bg-muted block rounded-md px-3 py-2" href="{% url 'account_login' %}" data-action="click->navbar#closeMenu">Login</a></li>
                <li><a class="hover:bg-muted block rounded-md px-3 py-2" href="{% url 'account_signup' %}" data-action="click->navbar#closeMenu">Sign up</a></li>
            {% endif %}
        </ul>
    </div>
</header>
