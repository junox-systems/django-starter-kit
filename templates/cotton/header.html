<header class="border-border bg-background relative border-b" data-controller="navbar">
    <nav class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4">
        <div class="flex items-center gap-6">
            <a class="font-heading text-xl font-semibold tracking-tight" href="{% url 'home' %}">{{ app_name }}</a>
        </div>
        <div class="flex items-center gap-2">
            <c-theme-toggle />
            {% if user.is_authenticated %}
                <c-btn href="{% url 'dashboard' %}" class="hidden md:inline-flex">Dashboard</c-btn>
            {% else %}
                <c-btn href="{% url 'account_login' %}" class="hidden md:inline-flex">Sign in</c-btn>
            {% endif %}
            <c-btn variant="ghost" size="icon" class="size-9 md:hidden" type="button" data-navbar-target="hamburgerIcon" data-action="click->navbar#toggleMenu" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu"><c-icon.menu /></c-btn>
            <c-btn variant="ghost" size="icon" class="size-9 md:hidden" type="button" data-navbar-target="closeIcon" data-action="click->navbar#closeMenu" aria-label="Close menu" hidden><c-icon.x /></c-btn>
        </div>
    </nav>
    <div class="border-border bg-background absolute inset-x-0 top-full border-b shadow-lg md:hidden" id="mobile-menu" data-navbar-target="mobileMenu" hidden>
        <ul class="mx-auto max-w-5xl space-y-1 px-4 py-4 text-sm">
            {% if user.is_authenticated %}
                <li><a class="hover:bg-muted block rounded-md px-3 py-2" href="{% url 'dashboard' %}" data-action="click->navbar#closeMenu">Dashboard</a></li>
            {% else %}
                <li><a class="hover:bg-muted block rounded-md px-3 py-2" href="{% url 'account_login' %}" data-action="click->navbar#closeMenu">Sign in</a></li>
            {% endif %}
        </ul>
    </div>
</header>
