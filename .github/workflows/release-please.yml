on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Settings live in release-please-config.json; the current version in
      # .release-please-manifest.json (release-please updates it).
      - uses: googleapis/release-please-action@v4
