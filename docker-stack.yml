# Swarm's template engine expands one level only: ${VAR:-${OTHER}} stays a
# literal string. Keep every default flat (${VAR:-default}), and export
# APP_SLUG yourself, because `docker stack deploy` does not read .env.
services:
  web:
    image: ${IMAGE_NAME:?IMAGE_NAME required}
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    # No published port: traffic enters through the nginx service.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${APP_SLUG:-django-starter-kit}:${POSTGRES_PASSWORD:-django}@db:5432/${APP_SLUG:-django-starter-kit}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_URL: ${EMAIL_URL:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      # https origin(s) nginx serves, e.g. https://example.com
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
    depends_on:
      - db
    healthcheck:
      # /healthz/ pings the DB; ALLOWED_HOSTS must keep localhost for this.
      test: ["CMD", "curl", "-fsS", "-H", "Host: localhost", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

  # django-q2 workers + scheduler; replicas 1 so schedules fire once.
  qcluster:
    image: ${IMAGE_NAME:?IMAGE_NAME required}
    entrypoint: ["/init.sh"]
    command: ["python", "manage.py", "qcluster"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${APP_SLUG:-django-starter-kit}:${POSTGRES_PASSWORD:-django}@db:5432/${APP_SLUG:-django-starter-kit}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_URL: ${EMAIL_URL:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
    depends_on:
      - db
    healthcheck:
      disable: true
    networks:
      - backend

  db:
    image: paradedb/paradedb:0.26.2-pg18
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      POSTGRES_USER: ${APP_SLUG:-django-starter-kit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${APP_SLUG:-django-starter-kit}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_SLUG:-django-starter-kit} -d ${APP_SLUG:-django-starter-kit}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  nginx:
    image: nginx:1.29-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    volumes:
      # Host dir with fullchain.pem + privkey.pem, on the node running nginx.
      - ${NGINX_CERTS_DIR:?NGINX_CERTS_DIR required}:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - backend

configs:
  nginx_conf:
    file: ./prod/nginx/nginx.conf

volumes:
  postgres_data:

networks:
  backend:
    driver: overlay
