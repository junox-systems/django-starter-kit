services:
  web:
    image: ${IMAGE_NAME:?IMAGE_NAME required}
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    # No published port: traffic enters through the nginx service.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-django}:${POSTGRES_PASSWORD:-django}@db:5432/${POSTGRES_DB:-django}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      # https origin(s) nginx serves, e.g. https://example.com
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
    depends_on:
      - db
    healthcheck:
      # /healthz/ pings the DB; ALLOWED_HOSTS must keep localhost for this.
      test: ["CMD", "curl", "-fsS", "-H", "Host: localhost", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

  # django-q2 workers + scheduler; replicas 1 so schedules fire once.
  qcluster:
    image: ${IMAGE_NAME:?IMAGE_NAME required}
    entrypoint: ["/init.sh"]
    command: ["uv", "run", "python", "manage.py", "qcluster"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-django}:${POSTGRES_PASSWORD:-django}@db:5432/${POSTGRES_DB:-django}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
    depends_on:
      - db
    healthcheck:
      disable: true
    networks:
      - backend

  db:
    image: pgvector/pgvector:0.8.6-pg18
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-django}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-django}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django} -d ${POSTGRES_DB:-django}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  s3:
    image: rustfs/rustfs:1.0.0-alpha.86
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY required}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_EXTERNAL_ADDRESS: ":9000"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend

  nginx:
    image: nginx:1.29-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    volumes:
      # Host dir with fullchain.pem + privkey.pem, on the node running nginx.
      - ${NGINX_CERTS_DIR:?NGINX_CERTS_DIR required}:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - backend

configs:
  nginx_conf:
    file: ./prod/nginx/nginx.conf

volumes:
  postgres_data:
  rustfs_data:

networks:
  backend:
    driver: overlay
