# Reverse proxy for docker-stack.yml — terminates TLS in front of Granian.
# Adapted from wagtail-starter-kit's prod/freebsd/nginx config.
#
# Certs: bind-mount a directory holding fullchain.pem + privkey.pem at
# /etc/nginx/certs (see the nginx service in docker-stack.yml).
#
# Django still treats requests as plain HTTP until you enable
# SECURE_PROXY_SSL_HEADER in config/settings/production.py — this proxy
# already sends X-Forwarded-Proto for it.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 60;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml image/svg+xml text/javascript;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Swarm's service VIP balances across web replicas.
    upstream django {
        server web:8000;
        keepalive 32;
    }

    # Static only: app pages are per-user, so they are never cached here.
    proxy_cache_path /var/cache/nginx/static
        keys_zone=static_cache:10m
        max_size=256m
        inactive=7d
        use_temp_path=off;

    # Channels websockets need the upgrade handshake passed through.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        client_max_body_size 16m;
        client_body_timeout 15s;
        client_header_timeout 15s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Security headers are Django's job (SecurityMiddleware).

        # WhiteNoise sets the cache headers (immutable only for Vite-hashed
        # files); nginx just keeps a copy so web replicas aren't hit for them.
        location /static/ {
            proxy_pass http://django;
            proxy_cache static_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache $upstream_cache_status;
            access_log off;
        }

        location / {
            proxy_pass http://django;
            proxy_read_timeout 60s;
        }
    }
}
