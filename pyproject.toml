[project]
name = "django-starter-kit"
version = "0.2.0"
description = "A modern, high-performance Django 5.2 LTS starter kit with best practices"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Core
    "django>=5.2.18,<5.3",
    "django-environ>=0.11.2",
    "granian[uvloop]>=2.8.1",
    "psycopg[binary]>=3.2.9",
    "whitenoise>=6.6.0",
    # Auth
    "django-allauth[idp-oidc,mfa,socialaccount]>=65.11.0",
    # API
    "django-modern-rest[jwt,msgspec,openapi]>=0.16.0",
    # Frontend
    "django-vite>=3.1.0",
    # Storage & Media
    "django-storages>=1.14.0",
    "django-imagekit>=5.0.0",
    "pillow>=13.0.0",
    "boto3>=1.30.0",
    # Email
    "django-anymail>=10.0",
    # Background Tasks (broker = the Django DB)
    "django-q2>=1.11.1",
    # CORS
    "django-cors-headers>=4.3.0",
    # Observability
    "sentry-sdk>=1.40.0",
    "opentelemetry-sdk>=1.36.0",
    "opentelemetry-exporter-otlp>=1.36.0",
    "opentelemetry-instrumentation-psycopg>=0.57b0",
    # Audit
    "django-auditlog>=3.0.0",
    # Utilities
    "django-constance>=4.3.5",
    "django-guardian>=3.3.1",
    "django-import-export>=4.4.1",
    "opentelemetry-instrumentation-asgi>=0.62b1",
    "dj-control-room[cache,urls,signals]>=1.8.1",
    "django-paradedb>=0.15.0",
]

# Dev-only: the production image runs `uv sync --no-dev`.
# e2e is not a default group: browser tests run on the host via `just e2e`,
# so containers and image builds never download Playwright.
[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=5.2.9,<5.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff==0.17.1",
]
e2e = [
    "pytest-playwright>=0.10.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"
# Ruff 0.17 widened its defaults (Markdown code blocks, more rules). Pin the
# previous ones; adopt new rules deliberately, not via a version bump.
include = ["*.py", "*.pyi", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["."]
# Browser tests need a Vite build + Chromium; run them with `just e2e`.
addopts = "-m 'not e2e'"
markers = ["e2e: browser tests (pytest-playwright), run via `just e2e`"]
